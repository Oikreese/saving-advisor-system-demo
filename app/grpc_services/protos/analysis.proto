syntax = "proto3";

package analysis;

// analysisrequest
message AnalysisRequest {
  string user_id = 1;
}

// analysisresponse
message AnalysisResponse {
  string user_id = 1;
  string analysis_summary = 2;
  int64 timestamp = 3;
  bool success = 4;
  string error_message = 5;
}

// analysis service定义
service AnalysisService {
  // getuserportfoliooverallanalysis
  rpc GetGeneralAnalysis(AnalysisRequest) returns (AnalysisResponse);
}
